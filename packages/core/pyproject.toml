[project]
name = "apud"
version = "0.0.1"
description = "IIIF-grounded, citable vision for historical documents: region crops for VLMs, W3C annotations out"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "cadeos" }]
keywords = ["iiif", "htr", "manuscripts", "digital-humanities", "vlm", "web-annotation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apud"]
