name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches package versions
        run: |
          for f in packages/core/pyproject.toml packages/mcp/pyproject.toml; do
            v=$(grep -m1 '^version = ' "$f" | cut -d'"' -f2)
            if [ "v$v" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$f has version $v, tag is $GITHUB_REF_NAME"; exit 1
            fi
          done
      - run: uv sync
      - run: uv run pytest
      - run: uv build --package apud -o dist/core
      - run: uv build --package apud-mcp -o dist/mcp
      - uses: actions/upload-artifact@v4
        with:
          name: dist-core
          path: dist/core/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mcp
          path: dist/mcp/

  # PyPI allows one pending trusted publisher per (repo, workflow, environment),
  # so each package publishes from its own environment.
  publish-core:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing, no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-core
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp:
    needs: publish-core
    runs-on: ubuntu-latest
    environment: pypi-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-mcp
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
